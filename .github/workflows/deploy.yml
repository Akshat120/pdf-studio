# Publishes PDF Studio to GitHub Pages. The app is fully static, so the
# repository is uploaded as-is — no build step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish, but skip queued ones in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages lets browsers cache files for 10 minutes, so a visitor could
      # get the new index.html with the old app.js. Stamping each deploy's asset
      # URLs with the commit makes browsers fetch matching files.
      - name: Version asset URLs
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
